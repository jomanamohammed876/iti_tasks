{% extends 'base.html' %}

{% block content %}
<h1>Update Trainee</h1>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <label for="name">Name:</label>
    <input type="text" id="name" name="trname" value="{{ trainee.name }}">
    <br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="tremail" value="{{ trainee.email }}">
    <br><br>

    <label for="image">Image:</label>
    {% if trainee.image %}
    <img style="width:150px;display:block;margin-bottom:8px" src="{{ trainee.image.url }}" alt="{{ trainee.name }}">
    {% endif %}
    <input type="file" id="image" name="trimage">
    <br><br>

    <button type="submit">Submit</button>
</form>
{% endblock %}
